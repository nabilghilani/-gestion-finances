name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler l'exécutable avec PyInstaller
        run: |
          pyinstaller --onefile --windowed --name GestionFinances gestion_finances.py

      - name: Publier le .exe comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: GestionFinances-exe
          path: dist/GestionFinances.exe
